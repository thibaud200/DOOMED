<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DOOMED — éditeur de niveaux</title>
<style>
html,body{margin:0;background:#111;color:#ddd;font:13px/1.4 Consolas,monospace}
#editeur{padding:12px}
#editeur h1{margin:0 0 8px;font-size:18px;color:#e33}
#editeur button,#editeur input,#editeur select{font:inherit;background:#222;color:#ddd;border:1px solid #555;padding:3px 7px;margin:2px}
#editeur button:hover{background:#333}
#editeur input[type=number]{width:52px}
#editeur .outil{min-width:96px;text-align:left}
#editeur .outil.actif{border-color:#ffd040;color:#ffd040}
#editeur .pastille{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border:1px solid #000}
#ed-zone{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
#ed-palette{display:flex;flex-direction:column;max-width:150px}
#ed-grille{image-rendering:pixelated;cursor:crosshair;border:1px solid #444}
#ed-infos{min-width:220px;max-width:320px;white-space:pre-wrap}
#ed-infos .ok{color:#5d5}#ed-infos .ko{color:#f66}
#ed-export{width:100%;max-width:900px;height:110px;margin-top:8px;background:#000;color:#9f9;border:1px solid #444}
</style>
</head>
<body>
<div id="editeur"></div>
<script src="js/04_maps.js"></script>
<script src="js/10_editeur_logique.js"></script>
<script src="js/11_editeur_ui.js"></script>
<script>
addEventListener('load', () => {
  try { initEditeur(document.getElementById('editeur')); }
  catch (e) { document.getElementById('editeur').textContent = 'Éditeur incomplet ou en erreur : ' + e.message; }
});
</script>
</body>
</html>
