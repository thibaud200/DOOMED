<script>

  const m = (e.message || 'erreur') + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';

});

<script>
"use strict";
/* ======================================================================
   Chaque fonction de test lève une erreur (assert) si quelque chose cloche.
   Les contrats ci-dessous doivent rester identiques aux en-têtes des js/*.js
   ====================================================================== */
const CONTRAT = {
  '01_core.js': 'W H HUD_H PLAY_H HOR TEX cv ctx fitCanvas clamp rand randInt angNorm rgb makeCanvas FB_IMG FB ZBUF text KEYS PRESSED MOUSE pressed ENTER FATAL showFatal DEBUG_FPS DEBUG_ASSETS FPS frame',
  '01b_images_ia.js': 'IMAGES_IA',
  '01c_images_freedoom.js': 'IMAGES_FREEDOOM',
  '01d_musiques_freedoom.js': 'MUSIQUES_FREEDOOM',
  '01e_sons_freedoom.js': 'SONS_FREEDOOM',
  '01f_interface_freedoom.js': 'INTERFACE_FREEDOOM',
  '02_assets.js': 'texFromCanvas grit TX WALL_TEX MONSTRES_GENERES enregistrerPoses ASSET_LIST drawAssetSheet imageIA appliquerImagesIA OBJETS_IA appliquerObjetsIA',
  '03_audio.js': 'audioUnlock tone noise distVol sfx',
  '03b_musique.js': 'SynthFM lireMidi lireGenmidi musiqueFreedoomDebut musiqueFreedoomFin MUSIQUE_FD',
  '03c_sons.js': 'jouerSonFD SONS_MONSTRES SONS_JEU',
  '04_maps.js': 'CELL_EMPTY CELL_BRICK CELL_TECH CELL_DOOR CELL_EXIT LEGEND SPAWN ITEM MAPS CLE_NIVEAUX CLE_TEST validateMap loadLevel',
  '05_render.js': 'FOV_PLANE VSCALE shadeOf shadePx camera lumiere render3D renderFloorCeil castWalls drawSprites',
  '06_game.js': 'G ENEMY_DEF wantsPointerLock onPointerUnlock say inventaire newPlayer startGame optionsTest startLevel restartLevel mkEnemy solidCell solidAt tryMove losClear computeFlow gameUpdate updatePlay updateWorld updateDoors updateEnemies updateShots updatePickups wake wakeNear hurtPlayer damageEnemy fire hitscan spawnFireball useAction enemyTex collectSprites',
  '07b_interface.js': 'IU interfaceDoomPrete texteDoom largeurTexteDoom nombreDoom chiffresDoom barreDoom nomVisage carteAuto statsNiveau ecranStats ecranFin TEXTE_FIN',
  '07c_menus.js': 'DIFFICULTES NB_SAUVEGARDES nouveauMenu menuActif menuMaj dessinerMenu lancerPartie codesTriche etatPartie sauverPartie chargerPartie lireSauvegardes',
  '07_hud.js': 'gameDraw doom fondTitre hudBg panel fmtTime drawWeapon drawHUD drawFace drawMinimap drawTitle drawVictory',
  '10_editeur_logique.js': 'ED_LIMITES',
  '11_editeur_ui.js': 'ED ED_COULEURS ED_NOMS',
};
const SONS = 'pistol shotgun click hit sight claw bite fireball boom epain edeath hurt pdeath pickup weapon door oof switch';

const rows = [];
let nOk = 0, nKo = 0, nWarn = 0;
function assert(c, msg) { if (!c) throw new Error(msg); }
function group(t) { rows.push(`<tr class="grp"><td colspan="2">${t}</td></tr>`); }
function test(name, fn) {
  try {
    const w = fn();
    if (typeof w === 'string' && w) { nWarn++; rows.push(`<tr><td class="warn">ALERTE</td><td>${name} — ${esc(w)}</td></tr>`); }
    else { nOk++; rows.push(`<tr><td class="ok">OK</td><td>${name}</td></tr>`); }
  } catch (e) {
    nKo++;
    rows.push(`<tr><td class="ko">ÉCHEC</td><td>${name}<br><span class="ko">${esc(e.message || e)}</span></td></tr>`);
  }
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const typeOf = n => { try { return (0, eval)('typeof ' + n); } catch (e) { return 'undefined'; } };
G.classique = true;   // groupes 1 à 9 : écran titre, HUD et pause d'origine ; l'interface Doom est testée au groupe 10
const step = (sec, each) => { for (let i = 0; i < sec * 60; i++) { if (each) each(i); gameUpdate(1 / 60); PRESSED.clear(); MOUSE.dx = 0; } };
const press = code => { PRESSED.add(code); gameUpdate(1 / 60); PRESSED.clear(); };

/* Espion sur text() : tout texte doit tenir dans l'écran (bug déjà vu : libellés du HUD sous l'écran). */
const horsEcran = [];
if (typeOf('text') === 'function') {
  const vraiText = text;
  window.text = function (str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px monospace';
    const w = ctx.measureText(String(str)).width;
    const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    if (x0 < -1 || x0 + w > W + 1 || y - size / 2 < -1 || y + size / 2 > H + 1)
      horsEcran.push(`« ${str} » en (${x | 0}, ${y | 0}) taille ${size}`);
    return vraiText.apply(this, arguments);
  };
}

/* ---------------- 1. chargement et contrats ---------------- */
group('1. Chargement des fichiers et contrats');
test('Aucune erreur au chargement des scripts', () => assert(!window.__bootErr, window.__errors.join(' | ')));
for (const [f, names] of Object.entries(CONTRAT)) {
  test(`Contrat de ${f}`, () => {
    const manque = names.split(' ').filter(n => typeOf(n) === 'undefined');
    assert(!manque.length, 'manquant : ' + manque.join(', '));
  });
}
test('Les 18 sons de sfx existent', () => {
  const manque = SONS.split(' ').filter(s => typeof sfx[s] !== 'function');
  assert(!manque.length, 'manquant : sfx.' + manque.join(', sfx.'));
});

/* ---------------- 2. textures ---------------- */
group('2. Textures et sprites (format attendu par le moteur)');
test('Chaque asset de ASSET_LIST a le bon format {w, h, px, cv}', () => {
  const pb = [];
  for (const k of ASSET_LIST) {
    const t = TX[k];
    if (!t) { pb.push(k + ' absent'); continue; }
    if (!(t.px instanceof Uint32Array)) { pb.push(k + ' : px n\'est pas un Uint32Array (canvas renvoyé au lieu des pixels ?)'); continue; }
    if (t.px.length !== t.w * t.h) pb.push(k + ' : taille px ≠ w×h');
    if (!t.cv || !t.cv.getContext) pb.push(k + ' : cv manquant');
    if (!t.px.some(c => c !== 0)) pb.push(k + ' : entièrement transparent');
  }
  assert(!pb.length, pb.join(' ; '));
});
test('Murs, sol, plafond : 64×64 et sans trou', () => {
  const pb = ['brick', 'tech', 'door', 'exit', 'floor', 'ceil'].filter(k => {
    const t = TX[k]; return !t || t.w !== 64 || t.h !== 64 || !t.px || t.px.some(c => c === 0);
  });
  assert(!pb.length, 'problème : ' + pb.join(', '));
});
test('WALL_TEX[1..4] = brique, tech, porte, sortie', () =>
  assert(WALL_TEX[1] === TX.brick && WALL_TEX[2] === TX.tech && WALL_TEX[3] === TX.door && WALL_TEX[4] === TX.exit, 'WALL_TEX mal rempli'));
test('Armes en vue subjective (canvas)', () => {
  for (const k of ['wpPistol', 'wpShotgun', 'wpFlash']) assert(TX[k] && TX[k].width > 0 && TX[k].getContext, k + ' absent ou pas un canvas');
});
test('Planche F2 dessinable', () => { drawAssetSheet(); });

/* ---------------- 3. cartes ---------------- */
group('3. Cartes');
MAPS.forEach((m, i) => {
  test(`${m.name} : validateMap`, () => { const e = validateMap(m); assert(!e.length, e.join(' ; ')); });
  test(`${m.name} : sortie atteignable depuis le départ (portes comprises)`, () => {
    const L = loadLevel(i);
    const parcours = avecSecrets => {   // cases atteintes depuis P ; les murs secrets ($) comptent si avecSecrets
      const seen = new Uint8Array(L.w * L.h), q = [[L.start.x | 0, L.start.y | 0]];
      let exit = false;
      seen[q[0][1] * L.w + q[0][0]] = 1;
      while (q.length) {
        const [x, y] = q.shift();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy, c = L.grid[ny * L.w + nx];
          const secret = avecSecrets && (L.secrets || []).some(s => s.x === nx && s.y === ny);
          if (c === CELL_EXIT) exit = true;
          if ((c === CELL_EMPTY || c === CELL_DOOR || secret) && !seen[ny * L.w + nx]) { seen[ny * L.w + nx] = 1; q.push([nx, ny]); }
        }
      }
      return { seen, exit };
    };
    assert(parcours(false).exit, 'aucun chemin du départ P jusqu\'à une case E (sans passer par un secret)');
    const seen = parcours(true).seen;
    const isoles = L.enemies.concat(L.items).filter(o => !seen[(o.y | 0) * L.w + (o.x | 0)]);
    if (isoles.length) return isoles.length + ' ennemi(s)/objet(s) inaccessible(s)';
  });
  test(`${m.name} : au moins 1 ennemi`, () => assert(loadLevel(i).enemies.length > 0, 'aucun ennemi'));
});
test('Le validateur refuse une carte cassée', () =>
  assert(validateMap({ name: 't', rows: ['#####', '#P.=#', '####'] }).length >= 2, 'carte cassée acceptée'));

/* ---------------- 4. rendu ---------------- */
group('4. Moteur de rendu');
MAPS.forEach((m, i) => {
  test(`${m.name} : image 3D variée, distances valides`, () => {
    const L = loadLevel(i);
    render3D(L.start, L, []);
    const set = new Set();
    for (let k = 0; k < FB.length; k += 97) set.add(FB[k]);
    assert(set.size > 30, `image presque unie (${set.size} couleurs) : textures ou rendu cassés`);
    for (let x = 0; x < W; x++) assert(ZBUF[x] > 0 && ZBUF[x] < 100, 'ZBUF invalide en x=' + x + ' : ' + ZBUF[x]);
  });
});
test('Vitesse : moins de 8 ms par image', () => {
  startGame();
  const s = collectSprites(), t0 = performance.now();
  for (let k = 0; k < 20; k++) render3D(G.P, G.L, s);
  const ms = (performance.now() - t0) / 20;
  assert(ms < 8, ms.toFixed(1) + ' ms par image');
  if (ms > 4) return ms.toFixed(1) + ' ms par image (correct mais à surveiller)';
});
test('Un sprite est caché derrière un mur', () => {
  startGame();
  const L = G.L; G.P.x = 2.5; G.P.y = 2.5; G.P.a = 0;      // salle de départ, mur à l'est (x = 7)
  render3D(G.P, L, []);
  const avant = FB.slice();
  render3D(G.P, L, [{ x: 12.5, y: 2.5, tex: TX.impA, scale: 0.9 }]);   // ennemi derrière le mur
  assert(FB.every((c, k) => c === avant[k]), 'le sprite est dessiné à travers le mur');
});

/* ---------------- 5. jeu ---------------- */
group('5. Partie simulée');
test('Combat 30 s : aucune erreur, joueur jamais dans un mur, des ennemis tués', () => {
  startGame(); G.P.hp = 1e6;
  G.P.x = 11.5; G.P.y = 6.5;                 // au milieu du hangar, face aux diablotins
  for (const e of G.enemies) wake(e);
  step(30, () => {
    const live = G.enemies.filter(e => e.state !== 'dead' && losClear(G.P.x, G.P.y, e.x, e.y));
    MOUSE.down = live.length > 0;
    if (live.length) {
      live.sort((a, b) => Math.hypot(a.x - G.P.x, a.y - G.P.y) - Math.hypot(b.x - G.P.x, b.y - G.P.y));
      G.P.a = Math.atan2(live[0].y - G.P.y, live[0].x - G.P.x);
    }
    assert(isFinite(G.P.x) && isFinite(G.P.y) && isFinite(G.P.hp), 'position ou vie non numérique');
    assert(!solidAt(G.P.x, G.P.y), 'joueur dans un mur');
    for (const e of G.enemies) assert(isFinite(e.x) && isFinite(e.y), 'ennemi à une position non numérique');
  });
  MOUSE.down = false;
  assert(G.kills > 0, 'aucun ennemi tué en 30 s de tir');
});
test('Pas de liste qui grossit sans fin (G.shots, G.fx)', () => {
  startGame(); G.P.hp = 1e6;
  for (const e of G.enemies) e.state = 'dead';
  // 60 boules de feu tirées contre un mur : toutes doivent exploser puis disparaître
  for (let k = 0; k < 60; k++) G.shots.push({ x: 4.5, y: 2.5, vx: 0, vy: -5, life: 4 });
  step(1);
  assert(G.shots.length === 0, `${G.shots.length} boule(s) de feu jamais retirée(s)`);
  assert(G.fx.length === 0, `${G.fx.length} explosion(s) jamais retirée(s) : G.fx grossit sans fin`);
});
test('Déplacement 20 s en tournant : jamais dans un mur', () => {
  startGame();
  KEYS.KeyW = true; KEYS.KeyD = true;
  try { step(20, i => { G.P.a += (i % 240 < 120 ? 0.03 : -0.05); G.P.hp = 100; assert(!solidAt(G.P.x, G.P.y), 'joueur dans un mur en (' + G.P.x.toFixed(2) + ', ' + G.P.y.toFixed(2) + ')'); }); }
  finally { KEYS.KeyW = false; KEYS.KeyD = false; }
});
test('[1a] computeFlow : distances justes, pas de saut d\'un bord à l\'autre', () => {
  if (typeof computeFlow !== 'function') return 'computeFlow absente (micro-tâche 1a pas encore faite)';
  startGame(); computeFlow();
  const L = G.L, f = G.flow, si = Math.floor(G.P.y) * L.w + Math.floor(G.P.x);
  assert(f[si] === 0, 'la case du joueur ne vaut pas 0');
  // cases atteignables depuis le joueur (sans ouvrir de secret) : toutes doivent avoir une distance
  const vu = new Uint8Array(L.w * L.h), q = [si];
  vu[si] = 1;
  while (q.length) {
    const i = q.pop(), x = i % L.w, y = (i / L.w) | 0;
    for (const j of [i + 1, i - 1, i + L.w, i - L.w])
      if (!vu[j] && (L.grid[j] === CELL_EMPTY || L.grid[j] === CELL_DOOR) && Math.abs((j % L.w) - x) + Math.abs(((j / L.w) | 0) - y) === 1) { vu[j] = 1; q.push(j); }
  }
  const atteignables = vu.reduce((n, v) => n + v, 0);
  assert(f.filter(v => v >= 0).length === atteignables, `des cases atteignables n'ont pas de distance (${f.filter(v => v >= 0).length} / ${atteignables})`);
  // mini-carte 3×2 ouverte sur les bords (défaut du 17/10, voir outils/defauts_ia.md)
  const sauve = G.L;
  G.L = { w: 3, h: 2, grid: new Uint8Array([0, 1, 0, 0, 1, 0]) }; G.P.x = 2.5; G.P.y = 0.5;
  try { computeFlow(); assert(Array.from(G.flow).join() === '-1,-1,0,-1,-1,1', 'saut d\'un bord à l\'autre : ' + Array.from(G.flow).join()); }
  finally { G.L = sauve; }
});
test('Porte : s\'ouvre à l\'approche, se referme ensuite', () => {
  startGame();
  const D = G.L.doors[0];
  G.P.x = D.x - 0.7 + 0.5; G.P.y = D.y + 0.5;
  step(1.2);
  assert(D.open === 1, 'porte non ouverte (open=' + D.open + ')');
  G.P.x = G.L.start.x; G.P.y = G.L.start.y;
  for (const e of G.enemies) e.state = 'dead';
  step(5);
  assert(D.open === 0, 'porte non refermée (open=' + D.open + ')');
});
test('Ramassages : trousse et fusil', () => {
  startGame();
  const med = G.items.find(i => i.type === 'medkit'), sg = G.items.find(i => i.type === 'shotgun');
  G.P.hp = 50; G.P.x = med.x; G.P.y = med.y; updatePickups();
  assert(G.P.hp === 75 && med.taken, 'trousse non ramassée');
  G.P.x = sg.x; G.P.y = sg.y; updatePickups();
  assert(G.P.hasShotgun && G.P.weapon === 1 && G.P.shells > 0, 'fusil non ramassé');
});
test('Enchaînement : sortie E1 → E2 → victoire → titre', () => {
  startGame();
  const exitOf = L => { for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (L.grid[y * L.w + x] === CELL_EXIT) return { x, y }; };
  for (let n = 0; n < MAPS.length; n++) {
    const L = G.L, e = exitOf(L);
    const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]].find(([dx, dy]) => L.grid[(e.y - dy) * L.w + (e.x - dx)] === CELL_EMPTY);
    G.P.x = e.x - dirs[0] + 0.5; G.P.y = e.y - dirs[1] + 0.5; G.P.a = Math.atan2(dirs[1], dirs[0]);
    press('KeyE');
    assert(G.state === 'clear', `${L.name} : E devant la sortie ne termine pas le niveau (état ${G.state})`);
    step(0.6); press('Enter');
  }
  assert(G.state === 'victory', 'pas d\'écran de victoire après le dernier niveau');
  step(1.1); press('Enter');
  assert(G.state === 'title', 'Entrée ne ramène pas à l\'écran titre');
});
test('Mort puis recommencer le niveau', () => {
  startGame(); G.P.hp = 5;
  hurtPlayer(10, { x: G.P.x + 1, y: G.P.y });
  gameUpdate(1 / 60);
  assert(G.state === 'dead', 'le joueur ne meurt pas');
  step(1.1); press('Enter');
  assert(G.state === 'play' && G.P.hp === 100, 'le niveau ne recommence pas avec 100 PV');
});
test('Tous les sons se jouent sans planter (même sans carte son)', () => {
  for (const s of SONS.split(' ')) sfx[s]('imp', 0.5);
});

/* ---------------- 6. affichage ---------------- */
group('6. Affichage de chaque écran');
for (const st of ['title', 'play', 'pause', 'dead', 'clear', 'victory']) {
  test(`Écran « ${st} » : se dessine, textes dans l'écran`, () => {
    startGame(); G.P.hp = 37; G.P.hurt = 0.3; G.P.flash = 0.05; G.state = st; G.stateT = 2;
    horsEcran.length = 0;
    gameDraw();
    assert(!horsEcran.length, 'texte hors écran : ' + horsEcran.slice(0, 4).join(' ; '));
  });
}
test('Les chiffres et libellés du HUD tiennent dans sa barre (y 272–320)', () => {
  startGame();
  const hors = [];
  const t = window.text;
  window.text = function (str, x, y, size) {
    if (y > PLAY_H && (y - size / 2 < PLAY_H - 1 || y + size / 2 > H + 1)) hors.push(`« ${str} » y=${y | 0}`);
    return t.apply(this, arguments);
  };
  try { drawHUD(); } finally { window.text = t; }
  assert(!hors.length, hors.join(' ; '));
});
test('Aucun texte du HUD n\'est caché sous le visage (x 217–263)', () => {
  startGame(); G.P.armor = 50;
  const caches = [], t = window.text;
  window.text = function (str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px monospace';
    const w = ctx.measureText(String(str)).width, x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    if (y > PLAY_H && x0 < 263 && x0 + w > 217) caches.push(`« ${str} » de x=${x0 | 0} à ${(x0 + w) | 0}`);
    return t.apply(this, arguments);
  };
  try { drawHUD(); } finally { window.text = t; }
  assert(!caches.length, 'texte recouvert par le visage : ' + caches.join(' ; '));
});

/* ---------------- 7. tests d'acceptation des micro-tâches ----------------
   Un test par micro-tâche d'INSTRUCTIONS_IA.md, nommé « [id] … ».
   Tant que la micro-tâche n'est pas faite, il affiche une ALERTE (n'empêche rien).
   Une fois faite, il doit être VERT : outils/ia_tache.py refuse sinon la réponse du modèle. */
group('7. Tests d\'acceptation des micro-tâches (INSTRUCTIONS_IA.md)');
const PAS_FAITE = 'micro-tâche pas encore faite';
const srcDe = n => typeOf(n) === 'function' ? String((0, eval)(n)) : '';
function textesDessines(fn) {   // tout le texte dessiné pendant fn (text() et ctx.fillText)
  const vus = [], t = window.text, f = ctx.fillText, td = window.texteDoom;
  window.text = function (s) { vus.push(String(s)); return t.apply(this, arguments); };
  ctx.fillText = function (s) { vus.push(String(s)); return f.apply(this, arguments); };
  window.texteDoom = function (s) { vus.push(String(s)); return td.apply(this, arguments); };   // police de Doom (07b)
  try { fn(); } finally { window.text = t; ctx.fillText = f; window.texteDoom = td; }
  return vus.join(' | ');
}
function avecCarte(rows, fn) {   // carte de test ajoutée le temps du test
  MAPS.push({ name: 'TEST', angle: 0, rows });
  try { return fn(MAPS.length - 1); } finally { MAPS.pop(); startGame(); }
}

test('[1b] carte des distances recalculée 4 fois par seconde', () => {

function testDessin(nomFn) {   // 5 poses : canvas 64×64, non vides, toutes différentes
  if (typeOf(nomFn) !== 'function') return PAS_FAITE;
  const f = (0, eval)(nomFn), empreintes = {};
  for (const p of ['a', 'b', 'atk', 'pain', 'corpse']) {
    const c = f(p);
    assert(c && c.getContext && c.width === 64 && c.height === 64, `${nomFn}('${p}') doit renvoyer un canvas 64×64`);
    const d = c.getContext('2d').getImageData(0, 0, 64, 64).data;
    let n = 0, sig = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 128) { n++; sig = (sig * 31 + i + d[i - 3]) % 1000000007; }
    assert(n > 80, `${nomFn}('${p}') : presque vide (${n} pixels opaques)`);
    empreintes[p] = n + ':' + sig;
  }
  assert(new Set(Object.values(empreintes)).size === 5, `${nomFn} : les 5 poses doivent être différentes`);
}

function avecStockage(fn) {   // sauvegarde et restaure les niveaux de l'utilisateur autour du test
  const cles = [CLE_NIVEAUX, CLE_TEST], sauve = {};
  try { for (const k of cles) sauve[k] = localStorage.getItem(k); } catch (e) { return 'localStorage indisponible dans ce navigateur'; }
  try { for (const k of cles) localStorage.removeItem(k); return fn(); }
  finally { for (const k of cles) { if (sauve[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, sauve[k]); } }
}
function divCachee() { const d = document.createElement('div'); d.style.display = 'none'; document.body.appendChild(d); return d; }

const CARTE_SOMBRE = { name: 'TEST', angle: 0, rows: ['######', '#P...#', '#....#', '##E###'], light: ['999999', '992209', '9f2229', '999999'] };
function avecCle(cle, fn) {   // sauvegarde et restaure une clé du localStorage de l'utilisateur autour du test
  let ancien;
  try { ancien = localStorage.getItem(cle); } catch (e) { return 'localStorage indisponible dans ce navigateur'; }
  try { return fn(); } finally { if (ancien === null) localStorage.removeItem(cle); else localStorage.setItem(cle, ancien); }
}
function audioFactice() {   // faux contexte WebAudio qui compte les notes programmées
  const noeud = () => ({ connect: x => x, start() {}, stop() {}, type: '', buffer: null,
    frequency: { value: 0, setValueAtTime() {}, exponentialRampToValueAtTime() {} },
    gain: { value: 1, setValueAtTime() {}, exponentialRampToValueAtTime() {} } });
  return { currentTime: 10, state: 'running', sampleRate: 8000, destination: {}, notes: 0,
    createOscillator() { this.notes++; return noeud(); }, createBufferSource() { this.notes++; return noeud(); },
    createGain: noeud, createBiquadFilter: noeud, resume() {},
    createBuffer() { return { getChannelData: () => new Float32Array(16) }; } };
}
function placerDevantSortie() {
  const L = G.L;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (L.grid[y * L.w + x] === CELL_EXIT) {
    const d = [[0, 1], [0, -1], [1, 0], [-1, 0]].find(([dx, dy]) => L.grid[(y - dy) * L.w + (x - dx)] === CELL_EMPTY);
    if (!d) continue;
    G.P.x = x - d[0] + 0.5; G.P.y = y - d[1] + 0.5; G.P.a = Math.atan2(d[1], d[0]); return;
  }
}

test('[orientation] textures à l\'endroit : murs, portes, objets, ennemis, sous les 4 directions', () => {
  // texture test : vert à gauche, magenta à droite ; à l'écran, le vert doit toujours être à gauche
  const asym = texFromCanvas(makeCanvas(64, 64, x => { x.fillStyle = '#00ff00'; x.fillRect(0, 0, 32, 64); x.fillStyle = '#ff00ff'; x.fillRect(32, 0, 32, 64); }), true);
  const sens = () => {
    const d = ctx.getImageData(0, 0, W, H).data; let gv = 0, nv = 0, gm = 0, nm = 0;
    for (let y = 40; y < H - 60; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
      if (g > 40 && g > 2 * r && g > 2 * b) { gv += x; nv++; } else if (r > 40 && b > 40 && r > 2 * g && b > 2 * g) { gm += x; nm++; }
    }
    return nv > 30 && nm > 30 ? (gv / nv < gm / nm ? 'ok' : 'en miroir') : 'invisible';
  };
  const salle = ['###E###', '#.....#', '#.....#', '#..P..#', '#.....#', '#.....#', '#######'], fautes = [];
  const cas = [
    ['mur', ['###E###', '#.....#', '#.....#', 'E..P..E', '#.....#', '#.....#', '###E###'], () => WALL_TEX[4], v => { WALL_TEX[4] = v; }, () => {}],
    ['porte', ['#########', '####E####', '####.####', '####=####', '#E.=P=.E#', '####=####', '####.####', '####E####', '#########'], () => TX.door, v => { TX.door = v; }, () => {}],
    ['objet', salle, () => TX.medkit, v => { TX.medkit = v; }, a => { G.items = [{ type: 'medkit', x: G.P.x + Math.cos(a) * 1.5, y: G.P.y + Math.sin(a) * 1.5, taken: false }]; }],
    ['ennemi', salle, () => TX.impA, v => { TX.impA = v; }, a => { const e = mkEnemy('imp', G.P.x + Math.cos(a) * 2, G.P.y + Math.sin(a) * 2); e.state = 'idle'; G.enemies = [e]; }],
  ];
  for (const [nom, rows, lire, poser, prep] of cas) {
    const avant = lire(); poser(asym);
    try {
      for (const [d, a] of [['est', 0], ['sud', Math.PI / 2], ['ouest', Math.PI], ['nord', -Math.PI / 2]]) {
        MAPS.push({ name: 'T', rows }); try { startGame(); startLevel(MAPS.length - 1); } finally { MAPS.pop(); }
        for (const e of G.enemies) e.state = 'dead';
        G.P.a = a; G.items = []; G.msg = ''; G.msgT = 0; prep(a);
        const arme = TX.wpPistol; TX.wpPistol = makeCanvas(1, 1);   // l'arme en main masquerait l'objet posé au centre
        try { gameDraw(); } finally { TX.wpPistol = arme; }
        const s = sens(); if (s !== 'ok') fautes.push(`${nom} vu vers l'${d} : ${s}`);
      }
    } finally { poser(avant); }
  }
  startGame();
  assert(!fautes.length, 'textures mal orientées : ' + fautes.join(' ; '));
});

const POSES_IA = ['A', 'B', 'Atk', 'Pain', 'Corpse'];
test('[ia] chaque entrée de IMAGES_IA est lisible (taille, palette, indices)', () => {
  const pb = [];
  for (const [k, e] of Object.entries(IMAGES_IA)) {
    if (!(e && Number.isInteger(e.w) && Number.isInteger(e.h) && e.w > 0 && e.h > 0)) { pb.push(k + ' : w/h invalides'); continue; }
    if (typeof e.pal !== 'string' || !/^([0-9a-f]{6})+$/.test(e.pal)) { pb.push(k + ' : palette invalide'); continue; }
    let d; try { d = atob(e.d); } catch (err) { pb.push(k + ' : base64 illisible'); continue; }
    if (d.length !== e.w * e.h) { pb.push(`${k} : ${d.length} pixels au lieu de ${e.w * e.h}`); continue; }
    const nc = e.pal.length / 6;
    for (let i = 0; i < d.length; i++) if (d.charCodeAt(i) >= nc) { pb.push(k + ' : indice hors palette'); break; }
    if (!ASSET_LIST.includes(k)) pb.push(k + ' : nom inconnu de ASSET_LIST');
    if (!imageIA(k)) pb.push(k + ' : imageIA() renvoie null');
  }
  assert(!pb.length, pb.slice(0, 6).join(' ; '));
});
test('[ia] imageIA : même format que texFromCanvas, null si absente ou abîmée', () => {
  assert(imageIA('nexistepas') === null, 'image absente : null attendu');

  IMAGES_IA.__abime = { w: 2, h: 2, tr: 0, pal: 'ff0000', d: btoa('\x00\x05\x00\x00') };
  IMAGES_IA.__court = { w: 4, h: 4, tr: 0, pal: 'ff0000', d: btoa('\x00') };
  try {
    const t = imageIA('__t');

    assert(t.px[0] === 0 && t.px[3] === 0 && t.px[1] === rgb(255, 0, 0), 'indice 0 transparent (tr = 1), indice 1 = rouge');
    const d = t.cv.getContext('2d').getImageData(0, 0, 2, 2).data;
    assert(d[3] === 0 && d[4] === 255 && d[7] === 255, 'le canvas cv doit refléter les pixels');
    assert(imageIA('__abime') === null && imageIA('__court') === null, 'indice hors palette ou pixels manquants : null');

});

test('[mo] chaque monstre traverse un couloir en serpentin (angles, intersections) sans se bloquer', () => {
  const r = Math.random;
  try {
    avecCarte(['#########', '#P......#', '#######.#', '#.......#', '#.#######', '#.....#.#', '#####.#.#', '#.....#.#', '#.###...#', '#.......#', '####E####'], i => {
      const lents = [];
      for (const t of Object.keys(ENEMY_DEF)) {
        let s = 12345; Math.random = () => ((s = (s * 1103515245 + 12345) % 2147483648) / 2147483648);
        startLevel(i); G.P.hp = 1e6;
        const e = mkEnemy(t, 7.5, 5.5); e.state = 'chase'; G.enemies = [e];   // au fond du cul-de-sac de droite
        let tps = null;
        for (let f = 0; f < 60 * 30 && tps === null; f++) { G.P.hp = 1e6; gameUpdate(1 / 60); if (Math.hypot(e.x - G.P.x, e.y - G.P.y) < 3.2) tps = f / 60; }
        // ~13 cases de chemin avant d'arriver à 3 cases du joueur (caco, 1,1 case/s : ~12 s) ;
        // un monstre qui bute dans les angles dépasse 1,5 × la durée du trajet (avant correction : caco 15 à 30 s)
        const ideal = 13 / e.def.speed;
        if (tps === null || tps > 1.5 * ideal) lents.push(`${t} : ${tps === null ? 'jamais arrivé' : tps.toFixed(1) + ' s'} (trajet ~${ideal.toFixed(0)} s)`);
        for (const [x, y] of [[e.x - e.def.r, e.y - e.def.r], [e.x + e.def.r, e.y + e.def.r]]) assert(!solidAt(x, y), t + ' dans un mur');
      }
      assert(!lents.length, 'monstre(s) ralenti(s) ou bloqué(s) dans les angles : ' + lents.join(' ; '));
    });
  } finally { Math.random = r; }
});

    press('KeyP'); assert(G.state === 'pause' && !G.menu, 'P : pause sans menu'); press('KeyP'); assert(G.state === 'play', 'P : reprendre');
  });
  test('[11d] options : réglettes et barre classique', () => {
    const sauve = Object.assign({}, SETTINGS);
    try {
      lancerPartie(2); press('Escape'); choisir('Options');
      SETTINGS.sens = 1; G.menu.sel = 0; press('ArrowRight'); assert(SETTINGS.sens === 1.25, 'sensibilité +0,25');
      G.menu.sel = 1; SETTINGS.volume = 0.5; press('ArrowLeft'); assert(Math.abs(SETTINGS.volume - 0.4) < 1e-9, 'volume -0,1');
      choisir("Barre d'état"); assert(SETTINGS.hudClassique === true && !doom(), 'barre classique attendue');
      SETTINGS.hudClassique = false; assert(doom(), 'retour à la barre de Doom');
      G.menu = nouveauMenu(); G.menu.pile.push(['principal', 0]); G.menu.page = 'options'; press('Escape');
      assert(G.menu && G.menu.page === 'principal', 'Échap : page précédente');
    } finally { Object.assign(SETTINGS, sauve); sauverReglages(); }
  });
  test('[11e] sauvegarde puis chargement : niveau, joueur, monstres, portes, objets', () => {
    const avant = localStorage.getItem('doomed_sauvegardes');
    try {
      localStorage.removeItem('doomed_sauvegardes');
      lancerPartie(3); startLevel(1);
      const P = G.P; P.hp = 42; P.x += 0.25; P.keys = { red: true };
      G.enemies[0].state = 'dead'; G.enemies[0].hp = 0; G.kills = 1;
      if (G.items[0]) G.items[0].taken = true;
      if (G.L.doors[0]) G.L.doors[0].open = 1;
      const x = P.x, n = G.enemies.length;
      press('Escape'); choisir('Sauvegarder'); G.menu.sel = 2; press('Enter');
      assert(G.state === 'play' && lireSauvegardes()[2], 'emplacement 3 non écrit');
      startGame(); assert(G.level === 0, 'nouvelle partie');
      press('Escape'); choisir('Charger une partie'); G.menu.sel = 2; press('Enter');
      assert(G.state === 'play' && G.level === 1 && G.difficulte === 3, 'mauvais niveau ou difficulté après chargement');
      assert(G.P.hp === 42 && Math.abs(G.P.x - x) < 1e-9 && G.P.keys.red, 'joueur non restauré');
      assert(G.enemies.length === n && G.enemies[0].state === 'dead' && G.enemies[0].def === ENEMY_DEF[G.enemies[0].type] && G.kills === 1, 'monstres non restaurés');
      if (G.items[0]) assert(G.items[0].taken, 'objet ramassé non restauré');
      if (G.L.doors[0]) assert(G.L.doors[0].open === 1, 'porte non restaurée');
      assert(chargerPartie(5) === false, 'un emplacement vide ne se charge pas');
    } finally { if (avant === null) localStorage.removeItem('doomed_sauvegardes'); else localStorage.setItem('doomed_sauvegardes', avant); lancerPartie(2); }
  });
  test('[11f] codes de triche : iddqd, idkfa, iddt, idclev', () => {
    const tape = s => { for (const c of s) press(/\d/.test(c) ? 'Digit' + c : 'Key' + c.toUpperCase()); };
    lancerPartie(2); G.triche = null;
    tape('iddqd'); assert(G.triche && G.triche.invincible && /dieu/i.test(G.msg), 'iddqd : mode dieu');
    G.P.hp = 50; hurtPlayer(30, { x: 0, y: 0 }); assert(G.P.hp === 50, 'mode dieu : aucun dégât');
    tape('iddqd'); assert(!G.triche.invincible, 'iddqd une 2e fois : désactivé');
    tape('idkfa'); assert(G.P.owned.every(Boolean) && G.P.keys.red && G.P.keys.blue && G.P.keys.yellow, 'idkfa : armes et clés');
    tape('iddt'); assert(G.L.carteComplete, 'iddt : carte complète');
    tape('idclev03'); assert(G.level === 2 && G.state === 'play', 'idclev03 : niveau 3 attendu (niveau ' + (G.level + 1) + ')');
    G.triche = null;
  });
  test('[11g] chaque page de menu se dessine dans l’écran', () => {
    const hors = [], td = window.texteDoom;
    window.texteDoom = function (str, x, y, e, align) {
      const l = largeurTexteDoom(str, e), x0 = align === 'center' ? x - l / 2 : align === 'right' ? x - l : x;
      if (x0 < -1 || x0 + l > W + 1 || y < -1 || y + 7 * (e || ECH) > H + 1) hors.push(`« ${str} » (${G.menu.page})`);
      return td.apply(this, arguments);
    };
    try {
      for (const enJeu of [false, true]) for (const page of Object.keys(PAGES)) {
        if (enJeu) { lancerPartie(2); G.state = 'pause'; } else G.state = 'title';
        G.menu = nouveauMenu(page); gameDraw();
        G.menu.confirm = { texte: 'Cauchemar : les monstres sont rapides et sans pitié. Vous êtes sûr ?', oui: () => {} }; gameDraw();
      }
    } finally { window.texteDoom = td; G.menu = null; }
    assert(!hors.length, 'texte hors écran : ' + hors.slice(0, 4).join(' ; '));
  });
}

/* ---------------- résultat ---------------- */
function afficherResultat() {
  document.getElementById('out').innerHTML = rows.join('');
  const sum = document.getElementById('sum');
  sum.className = nKo ? 'ko' : nWarn ? 'warn' : 'ok';
  sum.textContent = nKo ? `ÉCHEC : ${nKo} test(s) en échec, ${nOk} OK, ${nWarn} alerte(s)` : `TOUT EST VERT : ${nOk} tests OK` + (nWarn ? `, ${nWarn} alerte(s)` : '');
  document.title = (nKo ? '❌ ' : '✅ ') + 'DOOMED — tests';
  window.TEST_RESULT = { ok: nOk, ko: nKo, warn: nWarn };
}
const imagesIU = typeOf('IU') === 'undefined' ? [] : Object.values(IU).map(im => im.decode().catch(() => {}));
Promise.all(imagesIU).then(() => { testsInterfaceDoom(); afficherResultat(); }, () => afficherResultat());
