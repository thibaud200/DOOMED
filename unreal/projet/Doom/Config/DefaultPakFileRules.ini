; Règles de paquet de DOOMED (s'ajoutent à Engine\Config\BasePakFileRules.ini ; la première règle qui s'applique gagne).

[ExcludeNNEDenoiser]
; Débruiteur IA du moteur (path tracing, ~98 Mo de réseaux de neurones) : limité à l'éditeur dans Doom.uproject, mais le
; cooker prépare quand même le contenu des plugins actifs dans l'éditeur. Le jeu ne charge pas ce plugin : contenu inutile.
bExcludeFromPaks=true
bOverrideChunkManifest=true
+Files=".../Engine/Plugins/NNE/..."
